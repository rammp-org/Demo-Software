# --- cornell_feeding: PRPL planning stack (git-hosted, no public rosdep key) ---
# These keys exist so the package.xml <exec_depend> entries resolve; the actual
# installs happen in setup.sh (see "cornell_feeding pip dependencies" section,
# pinned to a prpl-mono commit). rosdep's pip installer cannot verify URL- or
# version-constrained entries ("Failed to detect successful installation"
# false negatives on every run), so setup.sh passes them via --skip-keys.
python3-pybullet-helpers-pip:
  ubuntu:
    pip:
      packages: []

